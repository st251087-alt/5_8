<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>カニの仕分けサバイバル</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* 砂浜のテクスチャと波のレイアウト */
        body { margin: 0; overflow: hidden; touch-action: none; user-select: none; -webkit-user-select: none; }
        
        .beach-bg {
            background-color: #dcbfa6;
            background-image: 
                radial-gradient(circle at 50% 50%, rgba(255,255,255,0.1) 0%, transparent 100%),
                url("data:image/svg+xml,%3Csvg viewBox='0 0 400 400' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)' opacity='0.08'/%3E%3C/svg%3E");
        }

        .wave-container {
            position: absolute;
            bottom: 0; left: 0; width: 100%; height: 35vh;
            overflow: hidden; pointer-events: none; z-index: 10;
        }

        .wave {
            position: absolute;
            bottom: -50px; left: -10%; width: 120%; height: 100%;
            border-radius: 50% 50% 0 0;
            opacity: 0.5;
            filter: blur(3px);
            animation: wave-anim 5s infinite alternate ease-in-out;
        }
        .wave-1 {
            background: radial-gradient(ellipse at top, rgba(255, 255, 255, 0.8) 0%, rgba(135, 206, 235, 0.4) 40%, rgba(65, 105, 225, 0.5) 100%);
        }
        .wave-2 {
            bottom: -80px;
            animation-delay: -2s; animation-duration: 7s;
            background: radial-gradient(ellipse at top, rgba(255, 255, 255, 0.9) 0%, rgba(173, 216, 230, 0.5) 50%, rgba(30, 144, 255, 0.6) 100%);
        }
        .wave-3 {
            bottom: -110px;
            animation-delay: -4s; animation-duration: 6s;
            background: radial-gradient(ellipse at top, rgba(255, 255, 255, 1) 0%, rgba(70, 130, 180, 0.6) 60%, rgba(0, 0, 139, 0.7) 100%);
        }

        @keyframes wave-anim {
            0% { transform: translateY(20px) scaleY(0.9) scaleX(1); }
            100% { transform: translateY(-30px) scaleY(1.1) scaleX(1.02); }
        }

        /* カニの基本スタイルと歩行アニメーション */
        .crab-wrapper {
            position: absolute;
            will-change: transform;
            cursor: pointer;
            z-index: 20;
            -webkit-tap-highlight-color: transparent;
        }
        
        .crab-svg { filter: drop-shadow(2px 4px 3px rgba(0,0,0,0.4)); }

        @keyframes walkL {
            0% { transform: translateY(0) rotate(0deg); }
            50% { transform: translateY(-4px) rotate(8deg); }
            100% { transform: translateY(0) rotate(0deg); }
        }
        @keyframes walkR {
            0% { transform: translateY(-4px) rotate(-8deg); }
            50% { transform: translateY(0) rotate(0deg); }
            100% { transform: translateY(-4px) rotate(-8deg); }
        }
        @keyframes bodyRoll {
            0% { transform: rotate(-3deg); }
            100% { transform: rotate(3deg); }
        }

        /* 捕獲エフェクト */
        .score-popup {
            position: absolute;
            color: #fbbf24; /* yellow-400 */
            font-weight: 900;
            font-size: 2rem;
            text-shadow: 0 2px 4px rgba(0,0,0,0.8), 0 0 10px rgba(255,255,255,0.5);
            pointer-events: none;
            z-index: 50;
            animation: popupAnim 0.6s ease-out forwards;
        }
        @keyframes popupAnim {
            0% { transform: translate(-50%, -50%) scale(0.5); opacity: 1; }
            50% { transform: translate(-50%, -100%) scale(1.2); opacity: 1; }
            100% { transform: translate(-50%, -150%) scale(1); opacity: 0; }
        }

        /* 画面フラッシュ */
        .flash-red {
            animation: flashAnim 0.3s ease-out;
        }
        @keyframes flashAnim {
            0% { background-color: rgba(220, 38, 38, 0.8); }
            100% { background-color: transparent; }
        }

        /* 魔王のアニメーション */
        @keyframes maouFloat {
            0% { transform: translateY(-5px); }
            100% { transform: translateY(5px); }
        }
        @keyframes maouShake {
            0% { transform: translate(1px, 1px) rotate(0deg); }
            25% { transform: translate(-1px, -2px) rotate(-1deg); }
            50% { transform: translate(-3px, 0px) rotate(1deg); }
            75% { transform: translate(3px, 2px) rotate(0deg); }
            100% { transform: translate(1px, -1px) rotate(-1deg); }
        }
        .maou-wrapper {
            position: absolute;
            z-index: 35;
            cursor: pointer;
            -webkit-tap-highlight-color: transparent;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }
        .maou-float {
            animation: maouFloat 1.5s infinite alternate ease-in-out;
        }
        .maou-shake {
            animation: maouShake 0.1s infinite;
        }
    </style>
</head>
<body class="w-screen h-screen relative bg-black">

    <!-- 背景・ゲームボード -->
    <div id="game-board" class="absolute inset-0 beach-bg">
        <!-- 飾り: ヒトデ -->

            </h1>

                </p>
                <div class="bg-red-900/50 p-3 rounded-xl border border-red-500/50 text-center mb-3">

                    <p class="text-white font-bold text-sm md:text-base">

                    </p>

            </div>
            <button id="start-btn" class="flex-shrink-0 px-8 py-4 md:px-10 md:py-5 bg-gradient-to-r from-orange-500 to-red-600 hover:from-orange-400 hover:to-red-500 text-white rounded-full font-black text-xl md:text-3xl shadow-[0_0_20px_rgba(234,88,12,0.6)] transform hover:scale-105 transition-all border-4 border-orange-200">
                ゲームスタート

    </div>

    <!-- ゲームオーバー画面 -->
    <div id="gameover-screen" class="absolute inset-0 bg-red-950/90 flex flex-col items-center justify-center z-[60] hidden backdrop-blur-md p-4">
        <h1 class="text-5xl md:text-7xl font-black text-red-500 mb-2 drop-shadow-[0_0_15px_rgba(239,68,68,0.8)]">GAME OVER</h1>
        <p id="gameover-reason" class="text-red-200 text-xl md:text-2xl mb-8 font-bold tracking-widest text-center">猛毒にやられた...</p>
        
        <div class="bg-black/40 p-6 md:p-8 rounded-3xl mb-8 border border-red-800/50 text-center w-full max-w-sm">
            <p class="text-gray-300 text-lg mb-2">最終スコア</p>
            <p id="final-score" class="text-6xl font-black text-yellow-400 drop-shadow-[0_2px_2px_rgba(0,0,0,1)]">0</p>
        </div>
        
        <button id="retry-btn" class="px-10 py-5 bg-white text-red-900 hover:bg-gray-200 rounded-full font-black text-2xl md:text-3xl shadow-[0_0_20px_rgba(255,255,255,0.4)] transform hover:scale-105 transition-all">
            もう一度挑む

    <script>
        // --- SVG Data ---
        const NORMAL_CRAB_SVG = `
            <svg viewBox="0 0 120 120" class="w-full h-full crab-svg">
                <g class="legs">
                    <g stroke="#612d11" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round" class="leg-l">

                        <polyline points="80,65 110,55 120,80" />
                        <polyline points="75,75 105,75 110,100" />
                        <polyline points="70,85 95,90 100,110" />
                    </g>
                </g>
                <path d="M45,45 Q20,10 15,25 Q10,40 35,50 Z" fill="#8c3f15" stroke="#4a1f0a" stroke-width="2"/>
                <path d="M15,25 Q10,15 25,15 Q30,25 25,30 Z" fill="#8c3f15" stroke="#4a1f0a" stroke-width="1"/>
                <path d="M75,45 Q100,10 105,25 Q110,40 85,50 Z" fill="#8c3f15" stroke="#4a1f0a" stroke-width="2"/>
                <path d="M105,25 Q110,15 95,15 Q90,25 95,30 Z" fill="#8c3f15" stroke="#4a1f0a" stroke-width="1"/>
                <!-- ゴツゴツした甲羅 -->
                <path d="M40,35 L80,35 L95,55 L80,85 L40,85 L25,55 Z" fill="#a04b1c" stroke="#4a1f0a" stroke-width="2"/>
                <path d="M50,45 Q60,50 70,45" stroke="#783410" stroke-width="2" fill="none"/>
                <circle cx="48" cy="30" r="3" fill="#111"/>
                <circle cx="72" cy="30" r="3" fill="#111"/>
            </svg>
        `;

        const POISON_CRAB_SVG = `
            <svg viewBox="0 0 120 120" class="w-full h-full crab-svg">
                <g class="legs">
                    <g stroke="#a67c52" stroke-width="6" fill="none" stroke-linecap="round" stroke-linejoin="round" class="leg-l">
                        <polyline points="40,60 20,50 15,70" />
                        <polyline points="42,70 18,65 12,85" />
                        <polyline points="45,80 22,80 18,100" />
                        <polyline points="50,90 30,95 28,110" />
                    </g>
                    <g stroke="#a67c52" stroke-width="6" fill="none" stroke-linecap="round" stroke-linejoin="round" class="leg-r">
                        <polyline points="80,60 100,50 105,70" />
                        <polyline points="78,70 102,65 108,85" />
                        <polyline points="75,80 98,80 102,100" />
                        <polyline points="70,90 90,95 92,110" />
                    </g>
                </g>
                <!-- 丸っこいハサミ -->
                <path d="M45,55 C25,35 15,50 25,65 Z" fill="#d9ad7c" stroke="#8b4513" stroke-width="2"/>
                <path d="M25,45 C15,40 15,55 25,55 Z" fill="#4a1010" stroke="#220000" stroke-width="1"/>
                <path d="M75,55 C95,35 105,50 95,65 Z" fill="#d9ad7c" stroke="#8b4513" stroke-width="2"/>
                <path d="M95,45 C105,40 105,55 95,55 Z" fill="#4a1010" stroke="#220000" stroke-width="1"/>
                <!-- 丸い甲羅 (スベスベマンジュウガニ) -->
                <path d="M30,65 C20,30 100,30 90,65 C85,95 35,95 30,65 Z" fill="#e6c29a" stroke="#8b4513" stroke-width="2"/>
                <!-- 毒々しい斑点模様 -->
                <path d="M50,45 C45,40 55,35 60,40 C65,45 55,50 50,45 Z" fill="#7a2016" opacity="0.85"/>
                <circle cx="35" cy="55" r="6" fill="#7a2016" opacity="0.85"/>
                <circle cx="85" cy="55" r="6" fill="#7a2016" opacity="0.85"/>
                <path d="M45,65 C40,75 50,80 55,70 C60,60 50,55 45,65 Z" fill="#7a2016" opacity="0.85"/>
                <path d="M75,65 C80,75 70,80 65,70 C60,60 70,55 75,65 Z" fill="#7a2016" opacity="0.85"/>
                <circle cx="60" cy="55" r="4" fill="#7a2016" opacity="0.85"/>
                <circle cx="60" cy="80" r="4" fill="#7a2016" opacity="0.85"/>
                <circle cx="40" cy="78" r="3" fill="#7a2016" opacity="0.85"/>
                <circle cx="80" cy="78" r="3" fill="#7a2016" opacity="0.85"/>
                <circle cx="50" cy="38" r="2" fill="#111"/>
                <circle cx="70" cy="38" r="2" fill="#111"/>
            </svg>
        `;

        const MAOU_CRAB_SVG = `
            <svg viewBox="0 0 150 150" class="w-full h-full crab-svg drop-shadow-[0_0_15px_rgba(220,38,38,0.8)]">
                <g class="legs">
                    <g stroke="#3a0000" stroke-width="6" fill="none" stroke-linecap="round" stroke-linejoin="round" class="leg-l">
                        <polyline points="45,70 20,55 10,85" />
                        <polyline points="45,85 15,75 5,105" />
                        <polyline points="50,100 20,95 15,130" />
                        <polyline points="55,115 30,110 25,140" />
                    </g>
                    <g stroke="#3a0000" stroke-width="6" fill="none" stroke-linecap="round" stroke-linejoin="round" class="leg-r">
                        <polyline points="105,70 130,55 140,85" />
                        <polyline points="105,85 135,75 145,105" />
                        <polyline points="100,100 130,95 135,130" />
                        <polyline points="95,115 120,110 125,140" />
                    </g>
                </g>
                <!-- 巨大なハサミ -->
                <path d="M50,60 Q15,20 10,40 Q5,60 35,75 Z" fill="#1a0000" stroke="#ff0000" stroke-width="2"/>
                <path d="M100,60 Q135,20 140,40 Q145,60 115,75 Z" fill="#1a0000" stroke="#ff0000" stroke-width="2"/>
                <!-- 棘々しい甲羅 -->
                <path d="M45,45 L75,30 L105,45 L120,75 L105,110 L75,120 L45,110 L30,75 Z" fill="#2a0000" stroke="#ff0000" stroke-width="3"/>
                <!-- 目 -->
                <circle cx="55" cy="50" r="6" fill="#ff0000"/>
                <circle cx="95" cy="50" r="6" fill="#ff0000"/>
                <circle cx="55" cy="50" r="2" fill="#fff"/>
                <circle cx="95" cy="50" r="2" fill="#fff"/>
                <!-- 王冠 -->
                <path d="M60,35 L65,15 L75,25 L85,15 L90,35 Z" fill="#fbbf24" stroke="#b45309" stroke-width="2"/>
            </svg>
        `;

        // --- Game Logic ---
        const gameBoard = document.getElementById('game-board');
        const scoreDisplay = document.getElementById('score-display');
        const startScreen = document.getElementById('start-screen');
        const gameoverScreen = document.getElementById('gameover-screen');
        const finalScoreDisplay = document.getElementById('final-score');
        const flashOverlay = document.getElementById('flash-overlay');

        // --- Audio System (Maou BGM) ---
        class MaouBGM {
            constructor() {
                const AudioContext = window.AudioContext || window.webkitAudioContext;
                this.ctx = new AudioContext();
                this.isPlaying = false;
                this.tempo = 65;
                this.beatDuration = 60 / this.tempo;
                this.nextNoteTime = 0;
                this.currentBeat = 0;
                this.timerID = null;

                // 魔王出現時のモードフラグ
                this.isMaouMode = false;
                this.droneOsc = null;
                this.droneLfo = null;
                this.droneGain = null;
                this.sirenOsc = null;
                this.sirenLfo = null;
                this.sirenGain = null;

                this.scale = [130.81, 146.83, 155.56, 174.61, 196.00, 207.65, 246.94, 261.63];
                this.chords = [
                    [0, 2, 4], // Cm
                    [5, 0, 2], // Ab
                    [3, 5, 0], // Fm
                    [4, 6, 1]  // G
                ];

                this.setupReverb();
            }

            setupReverb() {
                // 音割れ（クリッピング）を強力に防ぐコンプレッサー
                this.compressor = this.ctx.createDynamicsCompressor();
                this.compressor.threshold.value = -15; 
                this.compressor.knee.value = 20;
                this.compressor.ratio.value = 15;
                this.compressor.attack.value = 0.005;
                this.compressor.release.value = 0.1;
                this.compressor.connect(this.ctx.destination);

                // ドライ音（原音）
                this.mainOut = this.ctx.createGain();
                this.mainOut.connect(this.compressor);
                this.mainOut.gain.value = 1.0; 

                // ウェット音（残響音）
                this.convolver = this.ctx.createConvolver();
                this.convolver.buffer = this.createReverbImpulse(4.0, 3.5);

                // リバーブのシャリシャリノイズだけを削るローパスフィルター
                this.reverbFilter = this.ctx.createBiquadFilter();
                this.reverbFilter.type = 'lowpass';
                this.reverbFilter.frequency.value = 2000; 

                this.reverbGain = this.ctx.createGain();
                this.reverbGain.gain.value = 1.0; 

                this.convolver.connect(this.reverbFilter);
                this.reverbFilter.connect(this.reverbGain);
                this.reverbGain.connect(this.compressor);
            }

            createReverbImpulse(duration, decay) {
                const sampleRate = this.ctx.sampleRate;
                const length = sampleRate * duration;
                const impulse = this.ctx.createBuffer(2, length, sampleRate);
                const impulseL = impulse.getChannelData(0);
                const impulseR = impulse.getChannelData(1);

                for (let i = 0; i < length; i++) {
                    const envelope = Math.pow(1 - i / length, decay);
                    impulseL[i] = (Math.random() * 2 - 1) * envelope;
                    impulseR[i] = (Math.random() * 2 - 1) * envelope;
                }
                return impulse;
            }

            setMaouMode(active) {
                if (this.isMaouMode === active) return;
                this.isMaouMode = active;
                
                // 魔王出現時はテンポを大幅に上げて焦燥感を煽る（BPM 65 -> 120）
                this.tempo = active ? 120 : 65;
                this.beatDuration = 60 / this.tempo;

                if (active) {
                    this.startMaouDrone();
                } else {
                    this.stopMaouDrone();
                }
            }

            startMaouDrone() {
                const time = this.ctx.currentTime;
                
                // --- 地響きのような超低音のうなり ---
                this.droneOsc = this.ctx.createOscillator();
                this.droneOsc.type = 'sawtooth';
                this.droneOsc.frequency.setValueAtTime(40, time); 

                this.droneLfo = this.ctx.createOscillator();
                this.droneLfo.type = 'sine';
                this.droneLfo.frequency.setValueAtTime(2, time); // 2Hzで揺らす
                const lfoGain = this.ctx.createGain();
                lfoGain.gain.setValueAtTime(10, time);
                this.droneLfo.connect(lfoGain);
                lfoGain.connect(this.droneOsc.frequency);

                this.droneGain = this.ctx.createGain();
                this.droneGain.gain.setValueAtTime(0, time);
                this.droneGain.gain.linearRampToValueAtTime(0.5, time + 2); 

                this.droneOsc.connect(this.droneGain);
                this.droneGain.connect(this.mainOut);
                this.droneGain.connect(this.convolver);

                // --- 絶望感のある高音サイレン ---
                this.sirenOsc = this.ctx.createOscillator();
                this.sirenOsc.type = 'triangle';
                this.sirenOsc.frequency.setValueAtTime(800, time);
                
                this.sirenLfo = this.ctx.createOscillator();
                this.sirenLfo.type = 'sine';
                this.sirenLfo.frequency.setValueAtTime(0.5, time); // ゆっくり揺れる
                const sirenLfoGain = this.ctx.createGain();
                sirenLfoGain.gain.setValueAtTime(200, time); // 200Hz幅でピッチを変調
                this.sirenLfo.connect(sirenLfoGain);
                sirenLfoGain.connect(this.sirenOsc.frequency);

                this.sirenGain = this.ctx.createGain();
                this.sirenGain.gain.setValueAtTime(0, time);
                this.sirenGain.gain.linearRampToValueAtTime(0.1, time + 2); 

                this.sirenOsc.connect(this.sirenGain);
                this.sirenGain.connect(this.mainOut);
                this.sirenGain.connect(this.convolver);

                // 再生開始
                this.droneOsc.start(time);
                this.droneLfo.start(time);
                this.sirenOsc.start(time);
                this.sirenLfo.start(time);
            }

            stopMaouDrone() {
                const time = this.ctx.currentTime;
                if (this.droneOsc) {
                    this.droneGain.gain.linearRampToValueAtTime(0, time + 1.5);
                    this.droneOsc.stop(time + 1.5);
                    this.droneLfo.stop(time + 1.5);
                    this.droneOsc = null;
                }
                if (this.sirenOsc) {
                    this.sirenGain.gain.linearRampToValueAtTime(0, time + 1.5);
                    this.sirenOsc.stop(time + 1.5);
                    this.sirenLfo.stop(time + 1.5);
                    this.sirenOsc = null;
                }
            }

            start() {
                if (this.isPlaying) return;
                this.ctx.resume();
                this.isPlaying = true;
                this.nextNoteTime = this.ctx.currentTime + 0.1;
                this.currentBeat = 0;
                this.schedule();
            }

            stop() {
                this.isPlaying = false;
                clearTimeout(this.timerID);
            }

            playOrganChord(freqs, time, duration, vol = 0.12) {
                const masterGain = this.ctx.createGain();
                masterGain.gain.setValueAtTime(0, time);
                masterGain.gain.linearRampToValueAtTime(vol, time + 0.1);
                masterGain.gain.setValueAtTime(vol, time + duration - 0.2);
                masterGain.gain.linearRampToValueAtTime(0, time + duration);
                
                const filter = this.ctx.createBiquadFilter();
                filter.type = 'lowpass';
                filter.frequency.value = 1200; 
                filter.Q.value = 1.5; 
                
                masterGain.connect(filter);
                filter.connect(this.mainOut);
                filter.connect(this.convolver);

                freqs.forEach(f => {
                    this.createOscillator(f, 'sawtooth', time, duration, masterGain, 0.4, 0); 
                    this.createOscillator(f, 'square', time, duration, masterGain, 0.3, 10); 
                    this.createOscillator(f, 'square', time, duration, masterGain, 0.3, -10); 
                    this.createOscillator(f * 2, 'sawtooth', time, duration, masterGain, 0.2, 5); 
                    this.createOscillator(f * 0.5, 'square', time, duration, masterGain, 0.5, 0); 
                    this.createOscillator(f * 0.25, 'triangle', time, duration, masterGain, 0.4, 0); 
                });
            }

            createOscillator(freq, type, time, duration, dest, gainValue, detune = 0) {
                const osc = this.ctx.createOscillator();
                const gain = this.ctx.createGain();
                osc.type = type;
                osc.frequency.value = freq;
                osc.detune.value = detune; 
                gain.gain.value = gainValue;
                osc.connect(gain);
                gain.connect(dest);
                osc.start(time);
                osc.stop(time + duration);
            }

            playTimpani(freq, time) {
                const oscAttack = this.ctx.createOscillator();
                oscAttack.type = 'square';
                const filterAttack = this.ctx.createBiquadFilter();
                filterAttack.type = 'lowpass';
                filterAttack.frequency.setValueAtTime(800, time);
                filterAttack.frequency.exponentialRampToValueAtTime(50, time + 0.1);
                
                const osc = this.ctx.createOscillator();
                const gain = this.ctx.createGain();
                
                osc.type = 'sine';
                osc.frequency.setValueAtTime(freq * 1.5, time);
                osc.frequency.exponentialRampToValueAtTime(freq * 0.4, time + 0.6); 

                gain.gain.setValueAtTime(0, time);
                gain.gain.linearRampToValueAtTime(1.0, time + 0.02); 
                gain.gain.exponentialRampToValueAtTime(0.01, time + 1.5);

                oscAttack.connect(filterAttack);
                filterAttack.connect(gain);

                osc.connect(gain);
                gain.connect(this.mainOut);
                gain.connect(this.convolver); 
                
                oscAttack.start(time);
                oscAttack.stop(time + 0.1);
                osc.start(time);
                osc.stop(time + 1.5);
            }

            playCatchSound() {
                if(!this.isPlaying) return;
                const time = this.ctx.currentTime;
                const osc = this.ctx.createOscillator();
                const gain = this.ctx.createGain();
                osc.type = 'sine';
                osc.frequency.setValueAtTime(800, time);
                osc.frequency.exponentialRampToValueAtTime(1600, time + 0.1);
                
                gain.gain.setValueAtTime(0, time);
                gain.gain.linearRampToValueAtTime(0.2, time + 0.02);
                gain.gain.exponentialRampToValueAtTime(0.01, time + 0.1);
                
                gain.connect(this.mainOut);
                const seReverb = this.ctx.createGain();
                seReverb.gain.value = 0.5;
                seReverb.connect(this.convolver);
                gain.connect(seReverb);

                osc.connect(gain);
                osc.start(time);
                osc.stop(time + 0.1);
            }

            playGameOverSound() {
                const time = this.ctx.currentTime;
                const osc = this.ctx.createOscillator();
                const gain = this.ctx.createGain();
                osc.type = 'triangle';
                osc.frequency.setValueAtTime(150, time);
                osc.frequency.exponentialRampToValueAtTime(20, time + 2); 
                
                gain.gain.setValueAtTime(0, time);
                gain.gain.linearRampToValueAtTime(0.3, time + 0.1);
                gain.gain.exponentialRampToValueAtTime(0.01, time + 2);
                
                gain.connect(this.mainOut);
                gain.connect(this.convolver); 

                osc.connect(gain);
                osc.start(time);
                osc.stop(time + 2);
            }

            playMaouSpawnSound() {
                if (!this.isPlaying) return;
                const time = this.ctx.currentTime;
                const osc = this.ctx.createOscillator();
                const gain = this.ctx.createGain();
                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(100, time);
                osc.frequency.exponentialRampToValueAtTime(40, time + 3);
                
                gain.gain.setValueAtTime(0, time);
                gain.gain.linearRampToValueAtTime(0.8, time + 0.1);
                gain.gain.exponentialRampToValueAtTime(0.01, time + 3);
                
                gain.connect(this.mainOut);
                gain.connect(this.convolver);
                
                osc.connect(gain);
                osc.start(time);
                osc.stop(time + 3);
            }
            
            playMaouHitSound() {
                if (!this.isPlaying) return;
                const time = this.ctx.currentTime;
                const osc = this.ctx.createOscillator();
                const gain = this.ctx.createGain();
                osc.type = 'square';
                osc.frequency.setValueAtTime(200, time);
                osc.frequency.exponentialRampToValueAtTime(50, time + 0.1);
                
                gain.gain.setValueAtTime(0.3, time);
                gain.gain.exponentialRampToValueAtTime(0.01, time + 0.1);
                
                gain.connect(this.mainOut);
                
                osc.connect(gain);
                osc.start(time);
                osc.stop(time + 0.1);
            }

            schedule() {
                while (this.nextNoteTime < this.ctx.currentTime + 0.1) {
                    this.playBeat(this.currentBeat, this.nextNoteTime);
                    this.nextNoteTime += this.beatDuration;
                    this.currentBeat = (this.currentBeat + 1) % 16;
                }
                if (this.isPlaying) {
                    this.timerID = setTimeout(() => this.schedule(), 25);
                }
            }

            playBeat(beat, time) {
                const bar = Math.floor(beat / 4);
                const beatInBar = beat % 4;
                
                const chordBase = this.chords[bar % this.chords.length];
                let freqs = chordBase.map(i => this.scale[i]);
                let rootBass = this.scale[chordBase[0]] * 0.5;

                if (this.isMaouMode) {
                    // 魔王モード：全体的に半音下げて不協和音にする
                    const pitchDown = 0.9438; // 約半音下げる
                    freqs = freqs.map(f => f * pitchDown);
                    rootBass *= pitchDown;

                    // 悪魔の音程（トライトーン）を不協和音としてねじ込む
                    freqs.push(rootBass * 2 * 1.414); 
                    
                    // 心臓の鼓動のように毎拍ティンパニを鳴らして焦燥感を限界まで高める
                    this.playTimpani(65.41 * pitchDown, time); 
                } else {
                    if (beatInBar === 0 || beatInBar === 2) {
                        this.playTimpani(65.41, time); 
                    }
                }
                
                // 毎拍ベース音（ルート音の1オクターブ下）を刻む
                this.playOrganChord([rootBass], time, this.beatDuration * 0.8, this.isMaouMode ? 0.15 : 0.1);

                // 小節の頭で分厚い和音
                if (beatInBar === 0) {
                    this.playOrganChord(freqs, time, this.beatDuration * 4, this.isMaouMode ? 0.2 : 0.15); 
                }

                // ランダムな不気味メロディ
                if (Math.random() > 0.6) {
                    const melodyNote = this.scale[Math.floor(Math.random() * this.scale.length)] * 4;
                    this.playOrganChord([melodyNote * (this.isMaouMode ? 0.9438 : 1)], time, this.beatDuration, 0.05);
                }
            }
        }

        let isPlaying = false;
        let score = 0;
        let crabs = [];
        let crabIdCounter = 0;
        let bgm; // BGMインスタンス
        
        // 魔王関連の変数
        let maou = null;
        let maouSpawnTimer = 0;
        let maouLevel = 1;
        
        let lastTime = 0;
        let spawnTimer = 0;
        let spawnInterval = 1200; // ms
        let speedMultiplier = 1;
        let animationFrameId;

        document.getElementById('start-btn').addEventListener('click', startGame);
        document.getElementById('retry-btn').addEventListener('click', startGame);

        function startGame() {
            // BGMの初期化と再生
            if (!bgm) {
                bgm = new MaouBGM();
            }
            bgm.setMaouMode(false); // 念のためリセット
            bgm.start();

            isPlaying = true;
            score = 0;
            speedMultiplier = 1;
            spawnInterval = 1200;
            scoreDisplay.textContent = score;
            
            // クリーンアップ
            crabs.forEach(c => c.el.remove());
            crabs = [];
            if (maou) {
                maou.el.remove();
                maou = null;
            }
            maouLevel = 1;
            maouSpawnTimer = 15000 + Math.random() * 10000; // 15秒〜25秒後に最初の魔王
            
            startScreen.classList.add('hidden');
            gameoverScreen.classList.add('hidden');
            
            lastTime = performance.now();
            animationFrameId = requestAnimationFrame(gameLoop);
        }

        function gameOver(reason = "猛毒にやられた...") {
            isPlaying = false;
            cancelAnimationFrame(animationFrameId);
            
            document.getElementById('gameover-reason').innerHTML = reason;
            
            // BGM停止とゲームオーバー音再生
            if (bgm) {
                bgm.setMaouMode(false); // サイレン等を止める
                bgm.stop();
                bgm.playGameOverSound();
            }

            // フラッシュエフェクト
            flashOverlay.classList.add('flash-red');
            setTimeout(() => {
                flashOverlay.classList.remove('flash-red');
                finalScoreDisplay.textContent = score;
                gameoverScreen.classList.remove('hidden');
            }, 300);
        }

        function getSpawnAndTargetPoints() {
            const w = window.innerWidth;
            const h = window.innerHeight;
            const pad = 150; // 画面外のマージン
            const side = Math.floor(Math.random() * 4); // 0:Top, 1:Right, 2:Bottom, 3:Left
            
            let startX, startY;
            if (side === 0) { startX = Math.random() * w; startY = -pad; }
            else if (side === 1) { startX = w + pad; startY = Math.random() * h; }
            else if (side === 2) { startX = Math.random() * w; startY = h + pad; }
            else { startX = -pad; startY = Math.random() * h; }

            // ターゲットは画面中心のエリア
            const targetX = w * 0.2 + Math.random() * (w * 0.6);
            const targetY = h * 0.2 + Math.random() * (h * 0.6);

            return { startX, startY, targetX, targetY };
        }

        function spawnCrab() {
            const isPoison = Math.random() < 0.25; // 25%の確率で毒カニ
            const size = 60 + Math.random() * 50; // 60px - 110px
            const { startX, startY, targetX, targetY } = getSpawnAndTargetPoints();
            
            const dx = targetX - startX;
            const dy = targetY - startY;
            const distance = Math.sqrt(dx*dx + dy*dy);
            
            // 基本速度 + ランダム + 進行度による倍率
            const speed = (80 + Math.random() * 60) * speedMultiplier; 
            const vx = (dx / distance) * speed;
            const vy = (dy / distance) * speed;
            
            // 進行方向の角度
            const moveAngle = Math.atan2(vy, vx) * 180 / Math.PI;
            // カニは横歩きさせる (進行方向に対して±90度向く)
            const walkOffset = Math.random() > 0.5 ? 90 : -90;
            const visualRotation = moveAngle + walkOffset + 90; // SVGの上が0度になるよう調整

            const id = `crab-${crabIdCounter++}`;
            const el = document.createElement('div');
            el.className = 'crab-wrapper flex items-center justify-center';
            el.style.width = `${size}px`;
            el.style.height = `${size}px`;
            
            // 足と体の個別アニメーション速度
            const animSpeed = (0.2 + Math.random() * 0.15) / Math.max(0.5, speedMultiplier * 0.8);

            el.innerHTML = `
                <style>
                    .${id} .leg-l { animation: walkL ${animSpeed}s infinite linear; transform-origin: top center; }
                    .${id} .leg-r { animation: walkR ${animSpeed}s infinite linear; transform-origin: top center; }
                    .${id} .body-anim { animation: bodyRoll ${animSpeed * 1.5}s infinite alternate linear; }
                </style>
                <div class="body-anim ${id} w-full h-full" style="transform: rotate(${visualRotation}deg)">
                    ${isPoison ? POISON_CRAB_SVG : NORMAL_CRAB_SVG}
                </div>
            `;

            gameBoard.appendChild(el);

            const crabObj = { id, el, x: startX, y: startY, vx, vy, size, isPoison };
            crabs.push(crabObj);

            // タップ/クリックイベント
            el.addEventListener('pointerdown', (e) => {
                e.preventDefault(); // タッチ時のスクロール等防止
                e.stopPropagation();
                if (!isPlaying) return;

                if (isPoison) {
                    gameOver("猛毒にやられた...");
                } else {
                    catchCrab(crabObj, e.clientX, e.clientY);
                }
            });
        }

        function spawnMaou() {
            if (bgm) {
                bgm.playMaouSpawnSound();
                bgm.setMaouMode(true); // ★絶望のBGMへ切り替え
            }
            
            // 警告表示
            const warning = document.getElementById('warning-overlay');
            warning.classList.remove('hidden');
            setTimeout(() => warning.classList.add('hidden'), 1500);

            const size = 180;
            const x = window.innerWidth / 2;
            const y = 80; // 画面上部
            
            const el = document.createElement('div');
            el.className = 'maou-wrapper maou-float';
            el.style.left = `${x - size/2}px`;
            el.style.top = `${y}px`;
            el.style.width = `${size}px`;
            
            // 必要なタップ回数（レベルが上がるごとに増える）
            const maxHp = 5 + (maouLevel * 2);
            // 攻撃までの時間（秒）
            const maxCharge = Math.max(3.0, 7.0 - (maouLevel * 0.5));
            
            el.innerHTML = `
                <div class="w-full bg-black/80 border-2 border-red-800 p-1 mb-2 rounded shadow-[0_0_10px_rgba(255,0,0,0.5)]">
                    <div id="maou-charge" class="h-3 bg-gradient-to-r from-red-500 to-yellow-400 w-0 transition-all"></div>
                </div>
                <div class="w-full h-[${size}px]">
                    ${MAOU_CRAB_SVG}
                </div>
            `;
            
            gameBoard.appendChild(el);
            
            maou = {
                el,
                chargeBar: el.querySelector('#maou-charge'),
                hp: maxHp,
                charge: 0,
                maxCharge: maxCharge,
            };
            
            el.addEventListener('pointerdown', (e) => {
                e.preventDefault();
                e.stopPropagation();
                if (!isPlaying || !maou) return;
                
                hitMaou(e.clientX, e.clientY);
            });
        }

        function hitMaou(x, y) {
            if (!maou) return;
            
            maou.hp--;
            if (bgm) bgm.playMaouHitSound();

            // ダメージエフェクト
            maou.el.style.transform = 'scale(0.9)';
            setTimeout(() => { if (maou) maou.el.style.transform = ''; }, 50);

            if (maou.hp <= 0) {
                // 撃退成功
                if (bgm) bgm.setMaouMode(false); // ★元のBGMに戻す

                const bonus = 300 * maouLevel;
                score += bonus;
                scoreDisplay.textContent = score;
                
                const popup = document.createElement('div');
                popup.className = 'score-popup text-purple-400 font-black text-4xl';
                popup.style.left = `${x}px`;
                popup.style.top = `${y}px`;
                popup.textContent = `撃退! +${bonus}`;
                document.body.appendChild(popup);
                setTimeout(() => popup.remove(), 1000);
                
                maou.el.remove();
                maou = null;
                maouLevel++;
                maouSpawnTimer = 15000 + Math.random() * 10000; // 次の出現タイマーセット
            }
        }

        function catchCrab(crabObj, x, y) {
            // 効果音再生
            if (bgm) bgm.playCatchSound();

            // スコア処理
            score += 10;
            scoreDisplay.textContent = score;
            
            // 難易度上昇
            if (score % 50 === 0) {
                speedMultiplier += 0.15;
                spawnInterval = Math.max(400, spawnInterval - 100);
            }

            // エフェクト表示
            const popup = document.createElement('div');
            popup.className = 'score-popup';
            popup.style.left = `${x}px`;
            popup.style.top = `${y}px`;
            popup.textContent = '+10';
            document.body.appendChild(popup);
            setTimeout(() => popup.remove(), 600);

            removeCrab(crabObj);
        }

        function removeCrab(crabObj) {
            crabObj.el.remove();
            crabs = crabs.filter(c => c.id !== crabObj.id);
        }

        function gameLoop(timestamp) {
            if (!isPlaying) return;
            
            const deltaTime = (timestamp - lastTime) / 1000;
            lastTime = timestamp;
            
            // カニの移動と境界チェック
            const w = window.innerWidth;
            const h = window.innerHeight;
            const outMargin = 200;

            for (let i = crabs.length - 1; i >= 0; i--) {
                const c = crabs[i];
                c.x += c.vx * deltaTime;
                c.y += c.vy * deltaTime;
                
                c.el.style.transform = `translate(${c.x - c.size/2}px, ${c.y - c.size/2}px)`;
                
                // 画面外に完全に出たら消去
                if (c.x < -outMargin || c.x > w + outMargin || c.y < -outMargin || c.y > h + outMargin) {
                    removeCrab(c);
                }
            }
            
            // カニのスポーン制御
            spawnTimer += deltaTime * 1000;
            if (spawnTimer > spawnInterval) {
                spawnCrab();
                spawnTimer = 0;
            }
            
            // 魔王の出現とチャージ制御
            if (!maou) {
                maouSpawnTimer -= deltaTime * 1000;
                if (maouSpawnTimer <= 0) {
                    spawnMaou();
                }
            } else {
                // チャージ増加
                maou.charge += deltaTime;
                const chargePercent = (maou.charge / maou.maxCharge) * 100;
                maou.chargeBar.style.width = `${chargePercent}%`;
                
                // ゲージが80%を超えたら震える
                if (chargePercent > 80) {
                    maou.el.classList.add('maou-shake');
                    maou.el.classList.remove('maou-float');
                }
                
                // チャージ完了でゲームオーバー
                if (maou.charge >= maou.maxCharge) {
                    gameOver("魔王ガニの<br>滅びの波動を受けた...");
                }
            }
            
            animationFrameId = requestAnimationFrame(gameLoop);
        }

    </script>
</body>
